<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Spawned Overlay</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: transparent;
        color: white;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        user-select: none;
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
      }

      .monitoring-area {
        flex: 1;
        background: rgba(255, 0, 0, 0.1);
        border: 2px dashed rgba(255, 0, 0, 0.8);
        position: relative;
        min-height: 150px;
        -webkit-app-region: drag;
      }

      .monitoring-area::before {
        content: "MONITORING AREA";
        position: absolute;
        top: 5px;
        left: 5px;
        font-size: 10px;
        color: rgba(255, 0, 0, 0.8);
        background: rgba(0, 0, 0, 0.5);
        padding: 2px 5px;
        border-radius: 3px;
        pointer-events: none;
      }

      .bounds-display {
        position: absolute;
        top: 25px;
        left: 5px;
        font-size: 9px;
        color: rgba(255, 255, 0, 0.9);
        background: rgba(0, 0, 0, 0.7);
        padding: 3px 6px;
        border-radius: 3px;
        pointer-events: none;
        font-family: monospace;
        line-height: 1.2;
      }

      .change-location {
        position: absolute;
        background: rgba(255, 0, 255, 0.8);
        color: white;
        font-size: 8px;
        padding: 2px 4px;
        border-radius: 2px;
        pointer-events: none;
        font-family: monospace;
        border: 1px solid rgba(255, 0, 255, 1);
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
        100% { opacity: 0.8; transform: scale(1); }
      }

      .control-panel {
        background: rgba(0, 0, 0, 0.9);
        padding: 10px;
        border-top: 2px solid rgba(255, 255, 255, 0.3);
        -webkit-app-region: no-drag;
        min-height: 120px;
      }
      
      button {
        background: rgba(255, 0, 0, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
        padding: 8px 12px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 12px;
        margin: 2px;
        -webkit-app-region: no-drag;
      }
      
      button:hover {
        background: rgba(255, 0, 0, 1);
      }

      button:disabled {
        background: rgba(128, 128, 128, 0.5);
        cursor: not-allowed;
      }

      button.stop {
        background: rgba(255, 165, 0, 0.8);
      }

      button.stop:hover {
        background: rgba(255, 165, 0, 1);
      }

      .timer {
        font-size: 16px;
        font-weight: bold;
        margin: 5px 0;
        color: #00ff00;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      }

      .status {
        font-size: 11px;
        margin: 3px 0;
        color: #ffff00;
      }

      .change-indicator {
        font-size: 11px;
        margin: 3px 0;
        padding: 3px;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.3);
      }

      .control-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 5px 0;
      }

      .button-group {
        display: flex;
        gap: 5px;
      }

      .change-detected {
        color: #ff4444;
        background: rgba(255, 68, 68, 0.2);
      }

      .no-change {
        color: #44ff44;
        background: rgba(68, 255, 68, 0.2);
      }
      
    </style>
  </head>
  <body>
    <!-- Monitoring Area - This is what gets captured -->
    <div class="monitoring-area" id="monitoring-area">
      <!-- This area is transparent and shows what's being monitored -->
      <div class="bounds-display" id="bounds-display">
        X: --- Y: ---<br>
        W: --- H: ---
      </div>
    </div>
    
    <!-- Control Panel - UI elements outside monitoring area -->
    <div class="control-panel">
      <div class="control-row">
        <div>
          <div style="font-size: 14px; font-weight: bold; margin-bottom: 5px;">Screen Area Monitor</div>
          <div class="timer" id="timer">00:00:00</div>
        </div>
        <div class="button-group">
          <button id="start-watching">Start</button>
          <button id="stop-watching" class="stop" style="display: none;">Stop</button>
        </div>
      </div>
      
      <div class="control-row">
        <div class="status" id="status">Position red area over target to monitor</div>
        <div class="button-group">
          <button id="check-permissions" style="background: rgba(0, 100, 255, 0.8);">Permissions</button>
          <button id="debug-capture" style="background: rgba(255, 165, 0, 0.8);">Debug</button>
        </div>
      </div>
      
      <div class="control-row">
        <div style="display: flex; align-items: center; gap: 10px;">
          <label style="display: flex; align-items: center; gap: 5px; font-size: 12px;">
            <input type="checkbox" id="text-detection-enabled" style="margin: 0;">
            Text Detection
          </label>
          <input type="text" id="watch-words" placeholder="Enter words to watch (comma-separated)" 
                 style="flex: 1; padding: 4px; font-size: 11px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white; border-radius: 3px;">
        </div>
      </div>
      
      <div class="change-indicator" id="change-indicator">No changes detected</div>
    </div>
    
    <script src="https://unpkg.com/tesseract.js@v5.0.0/dist/tesseract.min.js"></script>
    <script>
      let isWatching = false;
      let startTime = null;
      let timerInterval = null;
      let changeCount = 0;
      
      // OCR worker for text detection
      let ocrWorker = null;

      const checkPermissionsButton = document.getElementById('check-permissions');
      const debugCaptureButton = document.getElementById('debug-capture');
      const startButton = document.getElementById('start-watching');
      const stopButton = document.getElementById('stop-watching');
      const timerElement = document.getElementById('timer');
      const statusElement = document.getElementById('status');
      const changeIndicatorElement = document.getElementById('change-indicator');
      const boundsDisplayElement = document.getElementById('bounds-display');
      const monitoringAreaElement = document.getElementById('monitoring-area');
      const textDetectionEnabledElement = document.getElementById('text-detection-enabled');
      const watchWordsElement = document.getElementById('watch-words');

      // Format time as HH:MM:SS
      function formatTime(seconds) {
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const secs = seconds % 60;
        return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }

      // Update timer display
      function updateTimer() {
        if (startTime) {
          const elapsed = Math.floor((Date.now() - startTime) / 1000);
          timerElement.textContent = formatTime(elapsed);
        }
      }

      // Update bounds display
      async function updateBoundsDisplay() {
        try {
          const monitoringBounds = await window.electronAPI.getMonitoringAreaBounds();
          if (monitoringBounds) {
            boundsDisplayElement.innerHTML = 
              `X: ${monitoringBounds.x} Y: ${monitoringBounds.y}<br>` +
              `W: ${monitoringBounds.width} H: ${monitoringBounds.height}`;
          }
        } catch (error) {
          console.error('Error updating bounds display:', error);
        }
      }

      // Clear change location indicators
      function clearChangeIndicators() {
        const existingIndicators = document.querySelectorAll('.change-location');
        existingIndicators.forEach(indicator => indicator.remove());
      }

      // Show change location indicator
      function showChangeLocation(bounds) {
        clearChangeIndicators();
        
        const indicator = document.createElement('div');
        indicator.className = 'change-location';
        indicator.innerHTML = `CHANGE<br>${bounds.x},${bounds.y}`;
        
        // Position the indicator next to the change indicator element in the control panel
        indicator.style.position = 'absolute';
        indicator.style.right = '10px';
        indicator.style.top = '50%';
        indicator.style.transform = 'translateY(-50%)';
        indicator.style.zIndex = '1000';
        
        // Add to the change indicator's parent (control panel area)
        changeIndicatorElement.parentElement.style.position = 'relative';
        changeIndicatorElement.parentElement.appendChild(indicator);
        
        // Remove indicator after 3 seconds
        setTimeout(() => {
          if (indicator.parentNode) {
            indicator.remove();
          }
        }, 3000);
      }

      // Initialize OCR worker
      async function initializeOCR() {
        if (!ocrWorker) {
          try {
            ocrWorker = await Tesseract.createWorker('eng');
            await ocrWorker.setParameters({
              tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .,!?-',
            });
          } catch (error) {
            console.error('Error initializing OCR worker:', error);
          }
        }
      }

      // Detect text in screenshot
      async function detectTextInScreenshot(screenshot, watchWords) {
        if (!ocrWorker || !watchWords || watchWords.length === 0) {
          return { text: '', foundWords: [] };
        }

        try {
          // Perform OCR
          const { data: { text } } = await ocrWorker.recognize(screenshot);
          
          // Check for watched words (case-insensitive)
          const foundWords = [];
          const lowerText = text.toLowerCase();
          
          for (const word of watchWords) {
            if (lowerText.includes(word.toLowerCase())) {
              foundWords.push(word);
            }
          }
          
          return { text: text.trim(), foundWords };
        } catch (error) {
          console.error('Error during OCR processing:', error);
          return { text: '', foundWords: [] };
        }
      }

      // Load and save text detection settings
      async function loadTextDetectionSettings() {
        try {
          const settings = await window.electronAPI.getTextDetectionSettings();
          textDetectionEnabledElement.checked = settings.enabled;
          watchWordsElement.value = settings.words.join(', ');
        } catch (error) {
          console.error('Error loading text detection settings:', error);
        }
      }

      async function saveTextDetectionSettings() {
        try {
          const enabled = textDetectionEnabledElement.checked;
          const words = watchWordsElement.value.split(',').map(w => w.trim()).filter(w => w.length > 0);
          await window.electronAPI.setTextDetection(enabled, words);
          
          // Initialize OCR worker if enabled
          if (enabled && !ocrWorker) {
            statusElement.textContent = 'Initializing text detection...';
            await initializeOCR();
            statusElement.textContent = 'Text detection ready';
            setTimeout(() => {
              statusElement.textContent = 'Position red area over target to monitor';
            }, 2000);
          }
        } catch (error) {
          console.error('Error saving text detection settings:', error);
        }
      }

      // Text detection event handlers
      textDetectionEnabledElement.addEventListener('change', saveTextDetectionSettings);
      watchWordsElement.addEventListener('blur', saveTextDetectionSettings);
      watchWordsElement.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          saveTextDetectionSettings();
        }
      });

      // Check permissions
      checkPermissionsButton.addEventListener('click', async () => {
        try {
          statusElement.textContent = 'Checking screen capture permissions...';
          const result = await window.electronAPI.checkScreenPermissions();
          
          if (result.hasPermission) {
            statusElement.textContent = 'Screen capture permissions: ✅ Granted';
            changeIndicatorElement.textContent = 'Ready to start watching';
            changeIndicatorElement.className = 'change-indicator no-change';
          } else {
            statusElement.textContent = 'Screen capture permissions: ❌ Not granted';
            changeIndicatorElement.textContent = 'Please grant permission in System Preferences';
            changeIndicatorElement.className = 'change-indicator change-detected';
          }
        } catch (error) {
          console.error('Error checking permissions:', error);
          statusElement.textContent = 'Error checking permissions';
        }
      });

      // Debug capture area
      debugCaptureButton.addEventListener('click', async () => {
        try {
          statusElement.textContent = 'Capturing debug image...';
          
          const fullBounds = await window.electronAPI.getOverlayBounds();
          const monitoringBounds = await window.electronAPI.getMonitoringAreaBounds();
          
          console.log('Full overlay bounds:', fullBounds);
          console.log('Monitoring area bounds:', monitoringBounds);
          
          if (!monitoringBounds) {
            statusElement.textContent = 'Error: Could not get monitoring area bounds';
            return;
          }

          const bounds = monitoringBounds;
          
          const result = await window.electronAPI.debugCaptureArea(bounds);
          
          if (result.success) {
            statusElement.textContent = `Debug image saved! Check your Desktop for overlay_capture_debug.png`;
            changeIndicatorElement.textContent = `Bounds: ${bounds.x},${bounds.y} ${bounds.width}x${bounds.height} | Size: ${result.imageSize} bytes`;
            changeIndicatorElement.className = 'change-indicator no-change';
            
            // Reset status after 5 seconds
            setTimeout(() => {
              statusElement.textContent = 'Ready to watch';
              changeIndicatorElement.textContent = 'No changes detected';
            }, 5000);
          } else {
            statusElement.textContent = `Debug capture failed: ${result.message}`;
            changeIndicatorElement.textContent = 'Debug capture error';
            changeIndicatorElement.className = 'change-indicator change-detected';
          }
        } catch (error) {
          console.error('Error in debug capture:', error);
          statusElement.textContent = 'Error during debug capture';
        }
      });

      // Start watching
      startButton.addEventListener('click', async () => {
        if (isWatching) return;

        try {
          // Check screen capture permissions first
          statusElement.textContent = 'Checking permissions...';
          const permissionResult = await window.electronAPI.checkScreenPermissions();
          
          if (!permissionResult.hasPermission) {
            statusElement.textContent = 'Screen capture permission required. Please grant permission in System Preferences > Security & Privacy > Privacy > Screen Recording';
            return;
          }

          // Get monitoring area bounds (excluding control panel)
          statusElement.textContent = 'Getting monitoring area bounds...';
          
          const fullBounds = await window.electronAPI.getOverlayBounds();
          const monitoringBounds = await window.electronAPI.getMonitoringAreaBounds();
          
          console.log('Full overlay bounds:', fullBounds);
          console.log('Monitoring area bounds:', monitoringBounds);
          
          if (!monitoringBounds) {
            statusElement.textContent = 'Error: Could not get overlay bounds';
            return;
          }

          const bounds = monitoringBounds;
          console.log('Starting watching with bounds:', bounds);
          statusElement.textContent = `Starting capture of area: ${bounds.x},${bounds.y} ${bounds.width}x${bounds.height}`;
          const result = await window.electronAPI.startWatching(bounds);
          
          if (result.success) {
            isWatching = true;
            startTime = Date.now();
            changeCount = 0;
            
            // Update UI
            startButton.style.display = 'none';
            stopButton.style.display = 'inline-block';
            statusElement.textContent = 'Monitoring red area only (controls excluded)...';
            changeIndicatorElement.textContent = 'Watching monitoring area - no changes detected';
            changeIndicatorElement.className = 'change-indicator no-change';
            
            // Start timer and bounds updating
            timerInterval = setInterval(() => {
              updateTimer();
              updateBoundsDisplay(); // Update bounds every second
            }, 1000);
            
            // Initial bounds display
            updateBoundsDisplay();
            
            // Listen for screen changes
            window.electronAPI.onScreenChangeDetected(async (event, data) => {
              if (data.hasChanged) {
                changeCount++;
                
                // Perform text detection if enabled and screenshot is provided
                let textDetectionResult = { text: '', foundWords: [] };
                if (data.textDetectionEnabled && data.screenshot && data.watchWords && data.watchWords.length > 0) {
                  textDetectionResult = await detectTextInScreenshot(data.screenshot, data.watchWords);
                }
                
                // Check for text detection results
                let changeText = `Change detected! (${changeCount} total)`;
                if (textDetectionResult.foundWords.length > 0) {
                  changeText = `TEXT FOUND: "${textDetectionResult.foundWords.join(', ')}" (${changeCount} total)`;
                  changeIndicatorElement.className = 'change-indicator change-detected';
                  
                  // Show text found indicator
                  window.electronAPI.getMonitoringAreaBounds().then(bounds => {
                    if (bounds) {
                      const indicator = document.createElement('div');
                      indicator.className = 'change-location';
                      indicator.innerHTML = `TEXT FOUND<br>${textDetectionResult.foundWords.join(', ')}`;
                      indicator.style.position = 'absolute';
                      indicator.style.right = '10px';
                      indicator.style.top = '50%';
                      indicator.style.transform = 'translateY(-50%)';
                      indicator.style.zIndex = '1000';
                      indicator.style.background = 'rgba(0, 255, 0, 0.8)'; // Green for text detection
                      
                      changeIndicatorElement.parentElement.style.position = 'relative';
                      changeIndicatorElement.parentElement.appendChild(indicator);
                      
                      setTimeout(() => {
                        if (indicator.parentNode) {
                          indicator.remove();
                        }
                      }, 5000); // Show longer for text detection
                    }
                  });
                } else {
                  changeIndicatorElement.className = 'change-indicator change-detected';
                  
                  // Show regular change location indicator
                  window.electronAPI.getMonitoringAreaBounds().then(bounds => {
                    if (bounds) {
                      showChangeLocation(bounds);
                    }
                  });
                }
                
                changeIndicatorElement.textContent = changeText;
                
                // Reset to no-change after 3 seconds (longer for text detection)
                setTimeout(() => {
                  changeIndicatorElement.textContent = `Monitoring... (${changeCount} changes detected)`;
                  changeIndicatorElement.className = 'change-indicator no-change';
                }, 3000);
              }
            });

            // Listen for auto-stop events (when window is moved/resized)
            window.electronAPI.onMonitoringAutoStopped((event, data) => {
              // Update monitoring state
              isWatching = false;
              startTime = null;
              
              // Update UI to stopped state
              startButton.style.display = 'inline-block';
              stopButton.style.display = 'none';
              statusElement.textContent = `Monitoring stopped: ${data.reason}. Reposition and click Start to resume.`;
              changeIndicatorElement.textContent = 'Ready to watch';
              changeIndicatorElement.className = 'change-indicator';
              
              // Stop timer
              if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
              }
              
              // Clear any change indicators
              clearChangeIndicators();
            });
            
          } else {
            statusElement.textContent = `Error: ${result.message}`;
          }
        } catch (error) {
          console.error('Error starting watching:', error);
          statusElement.textContent = 'Error starting screen watching';
        }
      });

      // Stop watching
      stopButton.addEventListener('click', async () => {
        if (!isWatching) return;

        try {
          const result = await window.electronAPI.stopWatching();
          
          if (result.success) {
            isWatching = false;
            startTime = null;
            
            // Update UI
            startButton.style.display = 'inline-block';
            stopButton.style.display = 'none';
            statusElement.textContent = `Stopped. Detected ${changeCount} changes total.`;
            changeIndicatorElement.textContent = 'Ready to watch';
            changeIndicatorElement.className = 'change-indicator';
            
            // Stop timer
            if (timerInterval) {
              clearInterval(timerInterval);
              timerInterval = null;
            }
            
            // Remove event listeners
            window.electronAPI.removeScreenChangeListener();
            window.electronAPI.removeMonitoringAutoStoppedListener();
            
          } else {
            statusElement.textContent = `Error: ${result.message}`;
          }
        } catch (error) {
          console.error('Error stopping watching:', error);
          statusElement.textContent = 'Error stopping screen watching';
        }
      });

      // Initialize bounds display on load
      window.addEventListener('DOMContentLoaded', async () => {
        updateBoundsDisplay();
        await loadTextDetectionSettings();
        
        // Initialize OCR if text detection is enabled
        const settings = await window.electronAPI.getTextDetectionSettings();
        if (settings.enabled) {
          await initializeOCR();
        }
        // Update bounds when window is moved or resized
        let boundsUpdateTimeout;
        const debouncedBoundsUpdate = () => {
          clearTimeout(boundsUpdateTimeout);
          boundsUpdateTimeout = setTimeout(updateBoundsDisplay, 100);
        };
        
        // Listen for window move/resize events
        window.addEventListener('resize', debouncedBoundsUpdate);
        // Update bounds periodically when not monitoring
        setInterval(() => {
          if (!isWatching) {
            updateBoundsDisplay();
          }
        }, 500);
      });

      // Clean up when window closes
      window.addEventListener('beforeunload', () => {
        if (timerInterval) {
          clearInterval(timerInterval);
        }
        window.electronAPI.removeScreenChangeListener();
        window.electronAPI.removeMonitoringAutoStoppedListener();
      });
    </script>
  </body>
</html>
