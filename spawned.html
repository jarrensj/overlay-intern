<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Spawned Overlay</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        -webkit-app-region: drag;
        user-select: none;
      }
      
      button {
        background: rgba(255, 0, 0, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        margin-top: 10px;
        -webkit-app-region: no-drag;
      }
      
      button:hover {
        background: rgba(255, 0, 0, 1);
      }
      
    </style>
  </head>
  <body>
    <h2>Watch Overlay</h2>
    <p>Drag this over the area you want to watch</p>
    <button id="start-watching">Start Watching</button>
    
    <script>
      document.getElementById('start-watching').addEventListener('click', () => {
        alert('work in progress');
        // Add your watching logic here
      });
    </script>
  </body>
</html>
